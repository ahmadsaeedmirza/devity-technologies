<svg width="1100" height="500" viewBox="0 0 1100 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="500" fill="#F7F4EC"/>

  <circle cx="550" cy="270" r="250" fill="#2DD4BF" opacity="0.04"/>

  <text x="550" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1217">Automated, but always traceable</text>

  <!-- MTD node -->
  <g transform="translate(220,280)">
    <rect x="-150" y="-100" width="300" height="200" rx="18" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <rect x="-50" y="-55" width="100" height="70" rx="6" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <line x1="-30" y1="-30" x2="30" y2="-30" stroke="#2DD4BF" stroke-width="2"/>
    <line x1="-30" y1="-10" x2="15" y2="-10" stroke="#0B1217" stroke-width="1.5" opacity="0.4"/>
    <text x="0" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B1217">MTD ITSA</text>
    <text x="0" y="76" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0B1217" opacity="0.55">April 2026</text>
  </g>

  <line x1="370" y1="280" x2="440" y2="280" stroke="#2DD4BF" stroke-width="2.5"/>

  <!-- Audit trail, dark hero, center -->
  <g transform="translate(550,280)">
    <rect x="-90" y="-110" width="180" height="220" rx="20" fill="#0B1217"/>
    <rect x="-40" y="-70" width="80" height="14" rx="3" fill="#2DD4BF"/>
    <rect x="-40" y="-45" width="60" height="10" rx="3" fill="#F7F4EC" opacity="0.4"/>
    <rect x="-40" y="-20" width="70" height="10" rx="3" fill="#F7F4EC" opacity="0.4"/>
    <rect x="-40" y="5" width="50" height="10" rx="3" fill="#F7F4EC" opacity="0.4"/>
    <text x="0" y="65" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F7F4EC">Audit trail</text>
  </g>

  <line x1="660" y1="280" x2="730" y2="280" stroke="#2DD4BF" stroke-width="2.5"/>

  <!-- Accountant accountable -->
  <g transform="translate(880,280)">
    <rect x="-150" y="-100" width="300" height="200" rx="18" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <circle cx="0" cy="-50" r="26" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <path d="M -35 25 C -35 -5, 35 -5, 35 25" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <text x="0" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B1217">Accountant</text>
    <text x="0" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0B1217" opacity="0.55">remains accountable</text>
  </g>
</svg>
