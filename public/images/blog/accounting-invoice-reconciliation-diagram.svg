<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="500" fill="#F7F4EC"/>

  <circle cx="600" cy="270" r="260" fill="#2DD4BF" opacity="0.04"/>

  <!-- arrows -->
  <path d="M 320 260 L 450 260" stroke="#2DD4BF" stroke-width="2.5" fill="none" marker-end="url(#a11)"/>
  <path d="M 740 260 L 870 260" stroke="#2DD4BF" stroke-width="2.5" fill="none" marker-end="url(#a11)"/>
  <defs>
    <marker id="a11" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Invoice in -->
  <g transform="translate(180,260)">
    <rect x="-120" y="-90" width="240" height="180" rx="18" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <rect x="-60" y="-50" width="120" height="90" rx="6" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <line x1="-45" y1="-25" x2="45" y2="-25" stroke="#2DD4BF" stroke-width="2"/>
    <line x1="-45" y1="0" x2="20" y2="0" stroke="#0B1217" stroke-width="1.5" opacity="0.4"/>
    <text x="0" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0B1217">Invoice in</text>
  </g>

  <!-- AI extraction, dark hero -->
  <g transform="translate(600,260)">
    <rect x="-140" y="-110" width="280" height="220" rx="22" fill="#0B1217"/>
    <circle cx="0" cy="-30" r="34" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <text x="0" y="-22" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2DD4BF">98%</text>
    <text x="0" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F7F4EC">AI extraction</text>
    <text x="0" y="78" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#F7F4EC" opacity="0.6">character-level accuracy</text>
  </g>

  <!-- Matched and coded -->
  <g transform="translate(1020,260)">
    <rect x="-120" y="-90" width="240" height="180" rx="18" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <circle cx="0" cy="-30" r="28" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <path d="M -12 -30 L -3 -20 L 16 -42" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="45" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0B1217">Matched &amp;</text>
    <text x="0" y="65" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0B1217">coded</text>
  </g>
</svg>
