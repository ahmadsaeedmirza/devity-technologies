<svg width="1200" height="480" viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="480" fill="#F7F4EC"/>

  <!-- background band -->
  <rect x="0" y="100" width="1200" height="300" fill="#2DD4BF" opacity="0.05"/>

  <!-- Scope column -->
  <g transform="translate(230,250)">
    <rect x="-160" y="-130" width="320" height="260" rx="18" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <path d="M 0 -95 L 26 -50 L -26 -50 Z" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linejoin="round"/>
    <line x1="0" y1="-80" x2="0" y2="-62" stroke="#2DD4BF" stroke-width="3"/>
    <circle cx="0" cy="-55" r="1.5" fill="#2DD4BF"/>
    <text x="0" y="0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#0B1217">Vague scope</text>
    <text x="0" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0B1217" opacity="0.6">No written feature list,</text>
    <text x="0" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0B1217" opacity="0.6">stays vague under questions</text>
  </g>

  <!-- Proof column, dark hero -->
  <g transform="translate(600,250)">
    <rect x="-170" y="-140" width="340" height="280" rx="20" fill="#0B1217"/>
    <path d="M 0 -95 L 26 -50 L -26 -50 Z" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linejoin="round"/>
    <line x1="0" y1="-80" x2="0" y2="-62" stroke="#2DD4BF" stroke-width="3"/>
    <circle cx="0" cy="-55" r="1.5" fill="#2DD4BF"/>
    <text x="0" y="0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#F7F4EC">No real proof</text>
    <text x="0" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#F7F4EC" opacity="0.65">No contactable</text>
    <text x="0" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#F7F4EC" opacity="0.65">references or live work</text>
  </g>

  <!-- Communication column -->
  <g transform="translate(970,250)">
    <rect x="-160" y="-130" width="320" height="260" rx="18" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <path d="M 0 -95 L 26 -50 L -26 -50 Z" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linejoin="round"/>
    <line x1="0" y1="-80" x2="0" y2="-62" stroke="#2DD4BF" stroke-width="3"/>
    <circle cx="0" cy="-55" r="1.5" fill="#2DD4BF"/>
    <text x="0" y="0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#0B1217">Poor communication</text>
    <text x="0" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0B1217" opacity="0.6">Slow, evasive, no</text>
    <text x="0" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0B1217" opacity="0.6">single point of contact</text>
  </g>
</svg>
