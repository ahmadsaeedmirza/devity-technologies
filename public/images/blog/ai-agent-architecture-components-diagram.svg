<svg width="1100" height="750" viewBox="0 0 1100 750" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="750" fill="#F7F4EC"/>

  <!-- Decorative dots -->
  <g fill="#0B1217" opacity="0.06">
    <circle cx="80" cy="80" r="3"/><circle cx="120" cy="80" r="3"/>
    <circle cx="80" cy="115" r="3"/><circle cx="120" cy="115" r="3"/>
  </g>

  <!-- soft background -->
  <circle cx="550" cy="380" r="230" fill="#2DD4BF" opacity="0.06"/>

  <!-- Spokes -->
  <line x1="550" y1="380" x2="550" y2="150" stroke="#2DD4BF" stroke-width="2.5"/>
  <line x1="550" y1="380" x2="830" y2="280" stroke="#2DD4BF" stroke-width="2.5"/>
  <line x1="550" y1="380" x2="830" y2="500" stroke="#2DD4BF" stroke-width="2.5"/>
  <line x1="550" y1="380" x2="270" y2="500" stroke="#2DD4BF" stroke-width="2.5"/>
  <line x1="550" y1="380" x2="270" y2="280" stroke="#2DD4BF" stroke-width="2.5"/>

  <!-- Central LLM node, dark hero -->
  <g transform="translate(550,380)">
    <circle cx="0" cy="0" r="105" fill="#0B1217"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <circle cx="-18" cy="-8" r="14" fill="none" stroke="#F7F4EC" stroke-width="2.5"/>
    <circle cx="18" cy="-8" r="14" fill="none" stroke="#F7F4EC" stroke-width="2.5"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#2DD4BF" stroke-width="2"/>
    <text x="0" y="46" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#F7F4EC">Language model</text>
  </g>

  <!-- Tools -->
  <g transform="translate(550,110)">
    <rect x="-90" y="-40" width="180" height="80" rx="12" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <circle cx="-55" cy="0" r="16" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <circle cx="-55" cy="0" r="5" fill="#2DD4BF"/>
    <text x="15" y="6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B1217">Tools</text>
  </g>

  <!-- Memory -->
  <g transform="translate(910,250)">
    <rect x="-95" y="-40" width="190" height="80" rx="12" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <path d="M -60 12 C -60 -8, -30 -8, -30 12 C -30 24, -45 30, -60 24 Z" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <text x="18" y="6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B1217">Memory</text>
  </g>

  <!-- Knowledge sources -->
  <g transform="translate(910,540)">
    <rect x="-105" y="-40" width="210" height="80" rx="12" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <rect x="-70" y="-14" width="18" height="28" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <rect x="-48" y="-20" width="18" height="34" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <text x="18" y="6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B1217">Knowledge</text>
  </g>

  <!-- Safety controls -->
  <g transform="translate(190,540)">
    <rect x="-100" y="-40" width="200" height="80" rx="12" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <path d="M -60 -14 L -60 6 C -60 18, -48 24, -40 26 C -32 24, -20 18, -20 6 L -20 -14 L -40 -22 Z" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="22" y="6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B1217">Safety controls</text>
  </g>

  <!-- Task connection -->
  <g transform="translate(190,250)">
    <rect x="-90" y="-40" width="180" height="80" rx="12" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <rect x="-55" y="-18" width="36" height="36" rx="4" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <text x="20" y="6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B1217">Task</text>
  </g>
</svg>
