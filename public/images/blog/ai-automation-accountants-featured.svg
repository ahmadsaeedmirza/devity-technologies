    <circle cx="70" cy="110" r="3"/><circle cx="110" cy="110" r="3"/><circle cx="150" cy="110" r="3"/>
    <circle cx="1050" cy="560" r="3"/><circle cx="1090" cy="560" r="3"/><circle cx="1130" cy="560" r="3"/>
    <circle cx="1050" cy="600" r="3"/><circle cx="1090" cy="600" r="3"/><circle cx="1130" cy="600" r="3"/>
  </g>

  <!-- receipt document -->
  <g transform="translate(390,320)">
    <path d="M -80 -160 L 80 -160 L 80 140 L 60 160 L 40 140 L 20 160 L 0 140 L -20 160 L -40 140 L -60 160 L -80 140 Z" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <line x1="-55" y1="-120" x2="55" y2="-120" stroke="#0B1217" stroke-width="2" opacity="0.3"/>
    <line x1="-55" y1="-90" x2="55" y2="-90" stroke="#0B1217" stroke-width="2" opacity="0.3"/>
    <line x1="-55" y1="-60" x2="20" y2="-60" stroke="#2DD4BF" stroke-width="2.5"/>
    <line x1="-55" y1="-30" x2="55" y2="-30" stroke="#0B1217" stroke-width="2" opacity="0.3"/>
    <line x1="-55" y1="0" x2="30" y2="0" stroke="#0B1217" stroke-width="2" opacity="0.3"/>
    <line x1="-55" y1="40" x2="55" y2="40" stroke="#0B1217" stroke-width="2" opacity="0.5"/>
    <text x="0" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B1217">TOTAL £248.00</text>
  </g>

  <!-- scan/extract arrow to ledger -->
  <path d="M 500 260 Q 620 180, 730 220" stroke="#2DD4BF" stroke-width="3" fill="none" stroke-dasharray="1 9" stroke-linecap="round"/>
  <path d="M 715 213 L 730 220 L 717 232" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ledger, dark hero -->
  <g transform="translate(870,310)">
    <rect x="-140" y="-150" width="280" height="300" rx="20" fill="#0B1217"/>
    <line x1="-90" y1="-90" x2="90" y2="-90" stroke="#2DD4BF" stroke-width="2" opacity="0.6"/>
    <rect x="-90" y="-65" width="130" height="14" rx="3" fill="#F7F4EC" opacity="0.15"/>
    <rect x="40" y="-65" width="50" height="14" rx="3" fill="#2DD4BF"/>
    <rect x="-90" y="-35" width="100" height="14" rx="3" fill="#F7F4EC" opacity="0.15"/>
    <rect x="40" y="-35" width="50" height="14" rx="3" fill="#2DD4BF" opacity="0.5"/>
    <rect x="-90" y="-5" width="120" height="14" rx="3" fill="#F7F4EC" opacity="0.15"/>
    <rect x="40" y="-5" width="50" height="14" rx="3" fill="#2DD4BF"/>
    <circle cx="-105" cy="80" r="24" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <path d="M -115 80 L -108 87 L -95 73" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
