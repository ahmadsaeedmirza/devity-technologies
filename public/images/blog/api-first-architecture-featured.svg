<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F7F4EC"/>

  <circle cx="600" cy="315" r="270" fill="#2DD4BF" opacity="0.05"/>

  <g fill="#0B1217" opacity="0.07">
    <circle cx="70" cy="70" r="3"/><circle cx="110" cy="70" r="3"/><circle cx="150" cy="70" r="3"/>
    <circle cx="70" cy="110" r="3"/><circle cx="110" cy="110" r="3"/><circle cx="150" cy="110" r="3"/>
    <circle cx="1050" cy="560" r="3"/><circle cx="1090" cy="560" r="3"/><circle cx="1130" cy="560" r="3"/>
    <circle cx="1050" cy="600" r="3"/><circle cx="1090" cy="600" r="3"/><circle cx="1130" cy="600" r="3"/>
  </g>

  <!-- Central API contract layer, dark hero -->
  <g transform="translate(600,320)">
    <rect x="-150" y="-70" width="300" height="140" rx="20" fill="#0B1217"/>
    <rect x="-150" y="-70" width="300" height="140" rx="20" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2DD4BF">{ }</text>
    <text x="0" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F7F4EC">API contract</text>
  </g>

  <!-- connectors to 4 consumer nodes -->
  <line x1="450" y1="270" x2="260" y2="150" stroke="#2DD4BF" stroke-width="2.5"/>
  <line x1="450" y1="370" x2="260" y2="490" stroke="#2DD4BF" stroke-width="2.5"/>
  <line x1="750" y1="270" x2="940" y2="150" stroke="#2DD4BF" stroke-width="2.5"/>
  <line x1="750" y1="370" x2="940" y2="490" stroke="#2DD4BF" stroke-width="2.5"/>

  <g font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B1217">
    <rect x="160" y="115" width="180" height="70" rx="14" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="250" y="156" text-anchor="middle">Web</text>

    <rect x="160" y="455" width="180" height="70" rx="14" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="250" y="496" text-anchor="middle">Mobile</text>

    <rect x="840" y="115" width="180" height="70" rx="14" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="930" y="156" text-anchor="middle">Integrations</text>

    <rect x="840" y="455" width="180" height="70" rx="14" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="930" y="496" text-anchor="middle">AI Agents</text>
  </g>

  <text x="600" y="590" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#0B1217" opacity="0.55">API FIRST ARCHITECTURE</text>
