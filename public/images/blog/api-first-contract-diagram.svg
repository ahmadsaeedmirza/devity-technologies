<svg width="1200" height="450" viewBox="0 0 1200 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="450" fill="#F7F4EC"/>

  <circle cx="600" cy="240" r="240" fill="#2DD4BF" opacity="0.04"/>

  <!-- Contract, dark hero, first -->
  <g transform="translate(210,240)">
    <rect x="-150" y="-100" width="300" height="200" rx="20" fill="#0B1217"/>
    <text x="0" y="-30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2DD4BF">1. Contract</text>
    <rect x="-90" y="0" width="180" height="14" rx="3" fill="#F7F4EC" opacity="0.2"/>
    <rect x="-90" y="24" width="130" height="14" rx="3" fill="#F7F4EC" opacity="0.2"/>
    <text x="0" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#F7F4EC" opacity="0.6">OpenAPI spec, agreed first</text>
  </g>

  <line x1="360" y1="240" x2="440" y2="240" stroke="#2DD4BF" stroke-width="2.5"/>
  <path d="M 425 228 L 440 240 L 425 252" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Frontend and backend in parallel -->
  <g transform="translate(620,180)">
    <rect x="-140" y="-45" width="280" height="90" rx="16" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0B1217">Frontend team</text>
  </g>
  <g transform="translate(620,300)">
    <rect x="-140" y="-45" width="280" height="90" rx="16" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="0" y="8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0B1217">Backend team</text>
  </g>
  <text x="620" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0B1217" opacity="0.5">building in parallel</text>

  <line x1="900" y1="180" x2="980" y2="240" stroke="#2DD4BF" stroke-width="2.5"/>
  <line x1="900" y1="300" x2="980" y2="240" stroke="#2DD4BF" stroke-width="2.5"/>

  <!-- Working system -->
  <g transform="translate(1080,240)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="#0B1217" stroke-width="3"/>
    <path d="M -20 5 L -8 17 L 22 -15" fill="none" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
