<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="500" fill="#F7F4EC"/>

  <circle cx="600" cy="270" r="260" fill="#2DD4BF" opacity="0.04"/>

  <text x="600" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1217">One API, every consumer</text>

  <!-- central API, dark hero -->
  <g transform="translate(600,290)">
    <circle cx="0" cy="0" r="100" fill="#0B1217"/>
    <text x="0" y="8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2DD4BF">API</text>
  </g>

  <!-- 3 spokes -->
  <line x1="600" y1="190" x2="600" y2="130" stroke="#2DD4BF" stroke-width="2.5"/>
  <line x1="680" y1="340" x2="880" y2="400" stroke="#2DD4BF" stroke-width="2.5"/>
  <line x1="520" y1="340" x2="320" y2="400" stroke="#2DD4BF" stroke-width="2.5"/>

  <g font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0B1217">
    <rect x="500" y="60" width="200" height="70" rx="14" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="600" y="102" text-anchor="middle">Website</text>

    <rect x="780" y="365" width="200" height="70" rx="14" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="880" y="407" text-anchor="middle">Mobile app</text>

    <rect x="220" y="365" width="200" height="70" rx="14" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="320" y="407" text-anchor="middle">Integrations</text>
  </g>
</svg>
