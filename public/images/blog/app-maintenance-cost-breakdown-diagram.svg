<svg width="1100" height="480" viewBox="0 0 1100 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="480" fill="#F7F4EC"/>

  <text x="550" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1217">Roughly 15-20% of build cost, annually</text>

  <!-- stacked segments in one bar, dark hero overall -->
  <g transform="translate(550,270)">
    <rect x="-350" y="-80" width="700" height="160" rx="20" fill="#0B1217"/>
    <rect x="-330" y="-30" width="180" height="60" rx="8" fill="#2DD4BF"/>
    <text x="-240" y="6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B1217">OS updates</text>

    <rect x="-130" y="-30" width="160" height="60" rx="8" fill="#2DD4BF" opacity="0.7"/>
    <text x="-50" y="6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B1217">Security</text>

    <rect x="50" y="-30" width="150" height="60" rx="8" fill="#2DD4BF" opacity="0.5"/>
    <text x="125" y="6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B1217">Bug fixes</text>

    <rect x="220" y="-30" width="110" height="60" rx="8" fill="#2DD4BF" opacity="0.3"/>
    <text x="275" y="6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0B1217">Features</text>
  </g>
</svg>
