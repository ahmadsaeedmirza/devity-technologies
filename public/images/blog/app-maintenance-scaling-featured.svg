<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F7F4EC"/>

  <circle cx="600" cy="315" r="270" fill="#2DD4BF" opacity="0.05"/>

  <g fill="#0B1217" opacity="0.07">
    <circle cx="70" cy="70" r="3"/><circle cx="110" cy="70" r="3"/><circle cx="150" cy="70" r="3"/>
    <circle cx="70" cy="110" r="3"/><circle cx="110" cy="110" r="3"/><circle cx="150" cy="110" r="3"/>
    <circle cx="1050" cy="560" r="3"/><circle cx="1090" cy="560" r="3"/><circle cx="1130" cy="560" r="3"/>
    <circle cx="1050" cy="600" r="3"/><circle cx="1090" cy="600" r="3"/><circle cx="1130" cy="600" r="3"/>
  </g>

  <!-- Launch flag, small, faded -->
  <g transform="translate(280,340)" opacity="0.4">
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#0B1217" stroke-width="4"/>
    <path d="M 0 -100 L 90 -75 L 0 -50 Z" fill="#0B1217"/>
    <text x="0" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B1217">Launch</text>
  </g>

  <!-- Ongoing cycle, dark hero -->
  <g transform="translate(760,320)">
    <circle cx="0" cy="0" r="150" fill="#0B1217"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-dasharray="1 8"/>
    <path d="M -40 -60 A 70 70 0 1 1 -40 60" fill="none" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round"/>
    <path d="M -58 -60 L -40 -60 L -40 -40" fill="none" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F7F4EC">Maintain, monitor, scale</text>
  </g>

  <text x="600" y="590" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#0B1217" opacity="0.55">AFTER LAUNCH</text>
</svg>
