<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="500" fill="#F7F4EC"/>

  <circle cx="600" cy="270" r="260" fill="#2DD4BF" opacity="0.04"/>

  <text x="600" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1217">Beyond keywords: what ranks an app in 2026</text>

  <!-- Keywords -->
  <g transform="translate(210,290)">
    <rect x="-160" y="-130" width="320" height="260" rx="20" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <circle cx="0" cy="-60" r="30" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <text x="0" y="-52" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2DD4BF">Aa</text>
    <text x="0" y="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0B1217">Keywords</text>
    <text x="0" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0B1217" opacity="0.55">Title, subtitle, metadata</text>
  </g>

  <!-- Quality, dark hero -->
  <g transform="translate(600,290)">
    <rect x="-170" y="-140" width="340" height="280" rx="22" fill="#0B1217"/>
    <circle cx="0" cy="-65" r="34" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <path d="M -14 -65 L -4 -55 L 16 -78" stroke="#2DD4BF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="20" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F7F4EC">Quality signals</text>
    <text x="0" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2DD4BF">Retention, engagement,</text>
    <text x="0" y="68" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2DD4BF">crash rate</text>
  </g>

  <!-- Reviews -->
  <g transform="translate(990,290)">
    <rect x="-160" y="-130" width="320" height="260" rx="20" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <g transform="translate(0,-60)" fill="#2DD4BF">
      <path d="M-45 0 L-42 8 L-34 8 L-40 13 L-38 21 L-45 16 L-52 21 L-50 13 L-56 8 L-48 8 Z"/>
      <path d="M-15 0 L-12 8 L-4 8 L-10 13 L-8 21 L-15 16 L-22 21 L-20 13 L-26 8 L-18 8 Z"/>
      <path d="M15 0 L18 8 L26 8 L20 13 L22 21 L15 16 L8 21 L10 13 L4 8 L12 8 Z"/>
      <path d="M45 0 L48 8 L56 8 L50 13 L52 21 L45 16 L38 21 L40 13 L34 8 L42 8 Z"/>
    </g>
    <text x="0" y="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0B1217">Reviews</text>
    <text x="0" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0B1217" opacity="0.55">Volume and rating</text>
  </g>
</svg>
