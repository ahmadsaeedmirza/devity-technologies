    <path d="M -34 60 C -34 15, 34 15, 34 60" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <rect x="-50" y="65" width="100" height="8" fill="#2DD4BF"/>
    <text x="0" y="115" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F7F4EC">Engineer</text>
  </g>

  <text x="600" y="590" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#0B1217" opacity="0.55">CONSULTANT VS DIY AUTOMATION</text>
