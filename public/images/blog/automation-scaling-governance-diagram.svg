<svg width="1200" height="480" viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="480" fill="#F7F4EC"/>

  <!-- arrows -->
  <path d="M 320 240 L 460 240" stroke="#2DD4BF" stroke-width="2.5" fill="none" marker-end="url(#a9)"/>
  <path d="M 740 240 L 880 240" stroke="#2DD4BF" stroke-width="2.5" fill="none" marker-end="url(#a9)"/>
  <defs>
    <marker id="a9" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Single pilot -->
  <g transform="translate(180,240)">
    <rect x="-130" y="-90" width="260" height="180" rx="16" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <circle cx="0" cy="-25" r="30" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <text x="0" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B1217">One pilot</text>
  </g>

  <!-- Measured expansion, dark hero -->
  <g transform="translate(600,240)">
    <rect x="-140" y="-100" width="280" height="200" rx="20" fill="#0B1217"/>
    <circle cx="-30" cy="-30" r="20" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <circle cx="10" cy="-15" r="20" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <circle cx="-10" cy="20" r="20" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <text x="0" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#F7F4EC">Measured expansion</text>
  </g>

  <!-- Governed portfolio -->
  <g transform="translate(1020,240)">
    <rect x="-130" y="-90" width="260" height="180" rx="16" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <rect x="-40" y="-40" width="30" height="30" rx="4" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <path d="M -33 -25 L -28 -19 L -18 -33" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="0" y="-40" width="30" height="30" rx="4" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <path d="M 7 -25 L 12 -19 L 22 -33" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B1217">Governed portfolio</text>
  </g>
</svg>
