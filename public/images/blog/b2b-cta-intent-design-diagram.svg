<svg width="1100" height="480" viewBox="0 0 1100 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="480" fill="#F7F4EC"/>

  <circle cx="550" cy="260" r="250" fill="#2DD4BF" opacity="0.04"/>

  <text x="550" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1217">Match the ask to the intent</text>

  <!-- Early stage visitor -->
  <g transform="translate(230,270)">
    <rect x="-160" y="-130" width="320" height="260" rx="20" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <text x="0" y="-85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B1217" opacity="0.6">RESEARCHING</text>
    <rect x="-90" y="-45" width="180" height="50" rx="25" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="0" y="-14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0B1217">Free technical audit</text>
    <text x="0" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0B1217" opacity="0.55">Low commitment,</text>
    <text x="0" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0B1217" opacity="0.55">builds trust first</text>
  </g>

  <!-- Late stage visitor, dark hero -->
  <g transform="translate(830,270)">
    <rect x="-170" y="-140" width="340" height="280" rx="22" fill="#0B1217"/>
    <text x="0" y="-95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2DD4BF">HIGH INTENT</text>
    <rect x="-95" y="-50" width="190" height="54" rx="27" fill="#2DD4BF"/>
    <text x="0" y="-16" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B1217">Book a discovery call</text>
    <text x="0" y="65" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#F7F4EC" opacity="0.65">Direct path,</text>
    <text x="0" y="85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#F7F4EC" opacity="0.65">no unnecessary steps</text>
  </g>
</svg>
