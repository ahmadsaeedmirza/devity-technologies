<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F7F4EC"/>

  <!-- layered depth -->
  <circle cx="350" cy="220" r="170" fill="#2DD4BF" opacity="0.05"/>
  <circle cx="850" cy="420" r="190" fill="#2DD4BF" opacity="0.05"/>

  <!-- decorative dots -->
  <g fill="#0B1217" opacity="0.07">
    <circle cx="70" cy="70" r="3"/><circle cx="110" cy="70" r="3"/><circle cx="150" cy="70" r="3"/>
    <circle cx="70" cy="110" r="3"/><circle cx="110" cy="110" r="3"/><circle cx="150" cy="110" r="3"/>
    <circle cx="1050" cy="560" r="3"/><circle cx="1090" cy="560" r="3"/><circle cx="1130" cy="560" r="3"/>
    <circle cx="1050" cy="600" r="3"/><circle cx="1090" cy="600" r="3"/><circle cx="1130" cy="600" r="3"/>
  </g>

  <!-- Funnel shape, dark hero -->
  <g transform="translate(600,320)">
    <path d="M -260 -180 L 260 -180 L 100 40 L 100 160 L -100 160 L -100 40 Z" fill="#0B1217"/>
    <line x1="-200" y1="-120" x2="200" y2="-120" stroke="#2DD4BF" stroke-width="2" opacity="0.4"/>
    <line x1="-140" y1="-60" x2="140" y2="-60" stroke="#2DD4BF" stroke-width="2" opacity="0.5"/>
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#2DD4BF" stroke-width="2.5" opacity="0.7"/>

    <!-- checkmark badge at bottom of funnel -->
    <circle cx="0" cy="115" r="30" fill="#2DD4BF"/>
    <path d="M -12 115 L -3 125 L 15 100" fill="none" stroke="#0B1217" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- labels either side -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B1217">
    <rect x="60" y="230" width="170" height="56" rx="28" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="145" y="264" text-anchor="middle">Clarity</text>

    <rect x="970" y="230" width="170" height="56" rx="28" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="1055" y="264" text-anchor="middle">Proof</text>

    <rect x="60" y="400" width="170" height="56" rx="28" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="145" y="434" text-anchor="middle">Speed</text>

    <rect x="970" y="400" width="170" height="56" rx="28" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="1055" y="434" text-anchor="middle">Trust</text>
  </g>

  <text x="600" y="580" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#0B1217" opacity="0.55">DESIGNING FOR CONVERSION</text>
</svg>
