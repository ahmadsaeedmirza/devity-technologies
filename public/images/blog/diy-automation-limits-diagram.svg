<svg width="1200" height="480" viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="480" fill="#F7F4EC"/>

  <circle cx="600" cy="260" r="260" fill="#2DD4BF" opacity="0.04"/>

  <text x="600" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1217">Where no-code tools start to strain</text>

  <g transform="translate(210,280)">
    <rect x="-160" y="-140" width="320" height="280" rx="20" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <path d="M -30 -60 L 0 -80 L 30 -60 L 30 -20 L -30 -20 Z" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="-20" y1="-40" x2="20" y2="-40" stroke="#2DD4BF" stroke-width="2"/>
    <text x="0" y="20" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B1217">Branching logic</text>
  </g>

  <!-- Silent failure, dark hero -->
  <g transform="translate(600,290)">
    <rect x="-170" y="-150" width="340" height="300" rx="22" fill="#0B1217"/>
    <path d="M 0 -85 L 34 -25 L -34 -25 Z" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linejoin="round"/>
    <line x1="0" y1="-70" x2="0" y2="-48" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-36" r="2" fill="#2DD4BF"/>
    <text x="0" y="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F7F4EC">Silent failure</text>
    <text x="0" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2DD4BF">no alert, weeks unnoticed</text>
  </g>

  <g transform="translate(990,280)">
    <rect x="-160" y="-140" width="320" height="280" rx="20" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <circle cx="-15" cy="-40" r="24" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <circle cx="20" cy="-15" r="24" fill="none" stroke="#0B1217" stroke-width="2" opacity="0.4"/>
    <text x="0" y="20" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B1217">Integration</text>
    <text x="0" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B1217">edge cases</text>
  </g>
</svg>
