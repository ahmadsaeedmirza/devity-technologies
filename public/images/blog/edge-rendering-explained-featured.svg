<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F7F4EC"/>

  <circle cx="600" cy="315" r="270" fill="#2DD4BF" opacity="0.05"/>

  <g fill="#0B1217" opacity="0.07">
    <circle cx="70" cy="70" r="3"/><circle cx="110" cy="70" r="3"/><circle cx="150" cy="70" r="3"/>
    <circle cx="70" cy="110" r="3"/><circle cx="110" cy="110" r="3"/><circle cx="150" cy="110" r="3"/>
    <circle cx="1050" cy="560" r="3"/><circle cx="1090" cy="560" r="3"/><circle cx="1130" cy="560" r="3"/>
    <circle cx="1050" cy="600" r="3"/><circle cx="1090" cy="600" r="3"/><circle cx="1130" cy="600" r="3"/>
  </g>

  <!-- Globe, dark hero -->
  <g transform="translate(600,320)">
    <circle cx="0" cy="0" r="170" fill="#0B1217"/>
    <circle cx="0" cy="0" r="170" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="65" ry="170" fill="none" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="125" ry="170" fill="none" stroke="#2DD4BF" stroke-width="1.5" opacity="0.3"/>
    <line x1="-170" y1="-85" x2="170" y2="-85" stroke="#2DD4BF" stroke-width="1.5" opacity="0.35"/>
    <line x1="-170" y1="0" x2="170" y2="0" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="-170" y1="85" x2="170" y2="85" stroke="#2DD4BF" stroke-width="1.5" opacity="0.35"/>

    <!-- edge node points -->
    <circle cx="-100" cy="-90" r="9" fill="#2DD4BF"/>
    <circle cx="110" cy="-40" r="9" fill="#2DD4BF"/>
    <circle cx="60" cy="110" r="9" fill="#2DD4BF"/>
    <circle cx="-90" cy="80" r="9" fill="#2DD4BF"/>
    <circle cx="0" cy="0" r="12" fill="#F7F4EC"/>

    <!-- connector lines from center to each node -->
    <line x1="0" y1="0" x2="-100" y2="-90" stroke="#2DD4BF" stroke-width="1.5" stroke-dasharray="1 6" opacity="0.7"/>
    <line x1="0" y1="0" x2="110" y2="-40" stroke="#2DD4BF" stroke-width="1.5" stroke-dasharray="1 6" opacity="0.7"/>
    <line x1="0" y1="0" x2="60" y2="110" stroke="#2DD4BF" stroke-width="1.5" stroke-dasharray="1 6" opacity="0.7"/>
    <line x1="0" y1="0" x2="-90" y2="80" stroke="#2DD4BF" stroke-width="1.5" stroke-dasharray="1 6" opacity="0.7"/>
  </g>

  <text x="600" y="570" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#0B1217" opacity="0.55">EDGE RENDERING</text>
</svg>
