<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F7F4EC"/>

  <!-- Decorative dot grid -->
  <g fill="#0B1217" opacity="0.06">
    <circle cx="90" cy="520" r="3"/><circle cx="140" cy="520" r="3"/><circle cx="190" cy="520" r="3"/>
    <circle cx="90" cy="560" r="3"/><circle cx="140" cy="560" r="3"/><circle cx="190" cy="560" r="3"/>
    <circle cx="1010" cy="90" r="3"/><circle cx="1060" cy="90" r="3"/><circle cx="1110" cy="90" r="3"/>
    <circle cx="1010" cy="130" r="3"/><circle cx="1060" cy="130" r="3"/><circle cx="1110" cy="130" r="3"/>
  </g>

  <!-- soft background circles -->
  <circle cx="600" cy="300" r="250" fill="#2DD4BF" opacity="0.07"/>

  <!-- Route line connecting three nodes -->
  <path d="M 260 380 Q 430 200, 600 300 T 940 260" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-dasharray="3 10" stroke-linecap="round"/>

  <!-- Node 1: Phone / customer call -->
  <g transform="translate(260,380)">
    <circle cx="0" cy="0" r="78" fill="#F7F4EC" stroke="#0B1217" stroke-width="3.5"/>
    <rect x="-22" y="-38" width="44" height="76" rx="10" fill="none" stroke="#0B1217" stroke-width="3"/>
    <line x1="-22" y1="26" x2="22" y2="26" stroke="#0B1217" stroke-width="2"/>
    <circle cx="0" cy="32" r="2.5" fill="#0B1217"/>
    <path d="M -34 -50 Q 0 -70, 34 -50" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <text x="0" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B1217">Call in</text>
  </g>

  <!-- Node 2: Dispatch, dark hero node -->
  <g transform="translate(600,270)">
    <circle cx="0" cy="0" r="92" fill="#0B1217"/>
    <rect x="-30" y="-26" width="60" height="52" rx="6" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <line x1="-30" y1="-8" x2="30" y2="-8" stroke="#2DD4BF" stroke-width="2"/>
    <circle cx="-18" cy="-17" r="3" fill="#2DD4BF"/>
    <circle cx="-6" cy="-17" r="3" fill="#2DD4BF"/>
    <text x="0" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#0B1217">Dispatch</text>
  </g>

  <!-- Node 3: Technician on route -->
  <g transform="translate(940,340)">
    <circle cx="0" cy="0" r="78" fill="#F7F4EC" stroke="#0B1217" stroke-width="3.5"/>
    <circle cx="0" cy="-30" r="16" fill="none" stroke="#0B1217" stroke-width="3"/>
    <path d="M -26 34 C -26 -4, 26 -4, 26 34 L 26 44 L -26 44 Z" fill="none" stroke="#0B1217" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 34 -10 L 46 -22 L 58 -10" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="112" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B1217">On the way</text>
  </g>

  <text x="600" y="580" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#0B1217" opacity="0.55">FIELD SERVICE AUTOMATION</text>
</svg>
