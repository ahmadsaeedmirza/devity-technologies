<svg width="1200" height="480" viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="480" fill="#F7F4EC"/>

  <!-- background band -->
  <rect x="0" y="150" width="1200" height="180" fill="#2DD4BF" opacity="0.05"/>

  <!-- connecting arrows -->
  <path d="M 300 240 L 430 240" stroke="#2DD4BF" stroke-width="2.5" fill="none" marker-end="url(#a1)"/>
  <path d="M 700 240 L 830 240" stroke="#2DD4BF" stroke-width="2.5" fill="none" marker-end="url(#a1)"/>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Stage 1: Job request -->
  <g transform="translate(160,240)">
    <rect x="-105" y="-70" width="210" height="140" rx="14" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <rect x="-105" y="-70" width="8" height="140" fill="#0B1217"/>
    <rect x="-55" y="-30" width="80" height="60" rx="6" fill="none" stroke="#0B1217" stroke-width="2.5"/>
    <line x1="-55" y1="-8" x2="25" y2="-8" stroke="#0B1217" stroke-width="1.5"/>
    <line x1="-55" y1="12" x2="10" y2="12" stroke="#0B1217" stroke-width="1.5"/>
    <text x="10" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B1217">Job request</text>
  </g>

  <!-- Stage 2: Technician matching, dark hero -->
  <g transform="translate(560,240)">
    <rect x="-135" y="-80" width="270" height="160" rx="16" fill="#0B1217"/>
    <circle cx="-40" cy="-20" r="22" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <path d="M -66 40 C -66 4, -14 4, -14 40" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <circle cx="40" cy="-20" r="22" fill="none" stroke="#F7F4EC" stroke-width="2" opacity="0.5"/>
    <path d="M 14 40 C 14 4, 66 4, 66 40" fill="none" stroke="#F7F4EC" stroke-width="2" opacity="0.5"/>
    <circle cx="-40" cy="-20" r="30" fill="none" stroke="#2DD4BF" stroke-width="1.5" stroke-dasharray="2 4"/>
    <text x="0" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#F7F4EC">Technician matching</text>
  </g>

  <!-- Stage 3: Route optimisation -->
  <g transform="translate(960,240)">
    <rect x="-105" y="-70" width="210" height="140" rx="14" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <rect x="-105" y="-70" width="8" height="140" fill="#2DD4BF"/>
    <path d="M -50 20 Q -20 -30, 20 -10 T 55 -30" fill="none" stroke="#0B1217" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-50" cy="20" r="5" fill="#0B1217"/>
    <circle cx="55" cy="-30" r="5" fill="#2DD4BF"/>
    <text x="10" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B1217">Route optimisation</text>
  </g>
</svg>
