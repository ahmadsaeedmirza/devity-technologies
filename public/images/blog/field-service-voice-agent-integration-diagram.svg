<svg width="1100" height="650" viewBox="0 0 1100 650" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="650" fill="#F7F4EC"/>

  <!-- Decorative dots -->
  <g fill="#0B1217" opacity="0.06">
    <circle cx="980" cy="80" r="3"/><circle cx="1020" cy="80" r="3"/>
    <circle cx="980" cy="115" r="3"/><circle cx="1020" cy="115" r="3"/>
  </g>

  <!-- soft background -->
  <circle cx="550" cy="330" r="260" fill="#2DD4BF" opacity="0.06"/>

  <!-- Caller node -->
  <g transform="translate(160,330)">
    <circle cx="0" cy="0" r="90" fill="#F7F4EC" stroke="#0B1217" stroke-width="3.5"/>
    <path d="M -20 -30 C -20 -44, 20 -44, 20 -30 C 20 -10, 30 10, 10 30 L -10 30 C -30 10, -20 -10, -20 -30 Z" fill="none" stroke="#0B1217" stroke-width="3" stroke-linejoin="round"/>
    <text x="0" y="126" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B1217">Caller</text>
  </g>

  <!-- sound wave connector -->
  <g stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M 262 300 Q 285 300, 285 330 Q 285 360, 305 360"/>
    <path d="M 262 330 L 330 330"/>
    <path d="M 262 360 Q 285 360, 285 330"/>
  </g>

  <!-- Voice agent node, dark hero -->
  <g transform="translate(550,330)">
    <circle cx="0" cy="0" r="110" fill="#0B1217"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <rect x="-14" y="-40" width="28" height="52" rx="14" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <path d="M -30 -6 Q -30 26, 0 26 Q 30 26, 30 -6" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <line x1="0" y1="26" x2="0" y2="42" stroke="#2DD4BF" stroke-width="2.5"/>
    <text x="0" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#F7F4EC">Voice agent</text>
  </g>

  <!-- connector to schedule -->
  <line x1="660" y1="330" x2="770" y2="330" stroke="#2DD4BF" stroke-width="2.5"/>

  <!-- Live schedule node -->
  <g transform="translate(920,330)">
    <rect x="-110" y="-90" width="220" height="180" rx="16" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <rect x="-110" y="-90" width="220" height="34" fill="#0B1217"/>
    <text x="0" y="-67" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#F7F4EC">TODAY</text>
    <rect x="-84" y="-38" width="168" height="20" rx="4" fill="#2DD4BF" opacity="0.3"/>
    <rect x="-84" y="-10" width="168" height="20" rx="4" fill="#0B1217" opacity="0.08"/>
    <rect x="-84" y="18" width="120" height="20" rx="4" fill="#0B1217" opacity="0.08"/>
    <rect x="-84" y="46" width="168" height="20" rx="4" fill="#2DD4BF" opacity="0.3"/>
    <text x="0" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B1217">Live schedule</text>
  </g>
</svg>
