<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F7F4EC"/>

  <!-- Decorative dots -->
  <g fill="#0B1217" opacity="0.06">
    <circle cx="90" cy="90" r="3"/><circle cx="140" cy="90" r="3"/><circle cx="190" cy="90" r="3"/>
    <circle cx="90" cy="130" r="3"/><circle cx="140" cy="130" r="3"/><circle cx="190" cy="130" r="3"/>
    <circle cx="1010" cy="510" r="3"/><circle cx="1060" cy="510" r="3"/><circle cx="1110" cy="510" r="3"/>
    <circle cx="1010" cy="550" r="3"/><circle cx="1060" cy="550" r="3"/><circle cx="1110" cy="550" r="3"/>
  </g>

  <!-- soft background -->
  <circle cx="600" cy="310" r="230" fill="#2DD4BF" opacity="0.06"/>

  <!-- Building on foundation, dark hero -->
  <g transform="translate(600,320)">
    <!-- foundation block -->
    <rect x="-180" y="90" width="360" height="50" fill="#0B1217"/>
    <text x="0" y="122" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2DD4BF">COMPLIANCE &amp; SECURITY</text>

    <!-- pillars -->
    <rect x="-150" y="-90" width="50" height="180" fill="none" stroke="#0B1217" stroke-width="3"/>
    <rect x="-60" y="-140" width="50" height="230" fill="none" stroke="#0B1217" stroke-width="3"/>
    <rect x="30" y="-110" width="50" height="200" fill="none" stroke="#0B1217" stroke-width="3"/>
    <rect x="120" y="-70" width="50" height="160" fill="none" stroke="#0B1217" stroke-width="3"/>

    <!-- roofline -->
    <path d="M -160 -90 L -125 -140 L -35 -140 L -35 -190 L 55 -190 L 55 -140 L 145 -140 L 180 -90" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <text x="600" y="600" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#0B1217" opacity="0.55">FINTECH SOFTWARE DEVELOPMENT</text>
</svg>
