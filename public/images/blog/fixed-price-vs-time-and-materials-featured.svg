<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F7F4EC"/>

  <!-- Decorative dots -->
  <g fill="#0B1217" opacity="0.06">
    <circle cx="90" cy="90" r="3"/><circle cx="140" cy="90" r="3"/><circle cx="190" cy="90" r="3"/>
    <circle cx="90" cy="130" r="3"/><circle cx="140" cy="130" r="3"/><circle cx="190" cy="130" r="3"/>
    <circle cx="1010" cy="510" r="3"/><circle cx="1060" cy="510" r="3"/><circle cx="1110" cy="510" r="3"/>
    <circle cx="1010" cy="550" r="3"/><circle cx="1060" cy="550" r="3"/><circle cx="1110" cy="550" r="3"/>
  </g>

  <!-- soft background -->
  <circle cx="600" cy="315" r="240" fill="#2DD4BF" opacity="0.06"/>

  <!-- balance beam -->
  <line x1="330" y1="230" x2="870" y2="230" stroke="#0B1217" stroke-width="6" stroke-linecap="round"/>
  <rect x="590" y="220" width="20" height="140" fill="#0B1217"/>
  <path d="M 560 360 L 640 360 L 620 400 L 580 400 Z" fill="#0B1217"/>

  <!-- Fixed price pan, dark hero -->
  <g transform="translate(330,340)">
    <line x1="0" y1="-110" x2="0" y2="-20" stroke="#2DD4BF" stroke-width="2.5"/>
    <line x1="-70" y1="-20" x2="70" y2="-20" stroke="#2DD4BF" stroke-width="2.5"/>
    <line x1="-70" y1="-20" x2="-95" y2="30" stroke="#2DD4BF" stroke-width="2.5"/>
    <line x1="70" y1="-20" x2="95" y2="30" stroke="#2DD4BF" stroke-width="2.5"/>
    <path d="M -95 30 A 95 24 0 0 0 95 30 Z" fill="#0B1217"/>
    <circle cx="0" cy="0" r="46" fill="#0B1217"/>
    <text x="0" y="6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F7F4EC">£</text>
    <text x="0" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B1217">Fixed price</text>
  </g>

  <!-- Time and materials pan -->
  <g transform="translate(870,230)">
    <line x1="0" y1="0" x2="0" y2="90" stroke="#2DD4BF" stroke-width="2.5"/>
    <line x1="-70" y1="90" x2="70" y2="90" stroke="#2DD4BF" stroke-width="2.5"/>
    <line x1="-70" y1="90" x2="-95" y2="140" stroke="#2DD4BF" stroke-width="2.5"/>
    <line x1="70" y1="90" x2="95" y2="140" stroke="#2DD4BF" stroke-width="2.5"/>
    <path d="M -95 140 A 95 24 0 0 0 95 140 Z" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <circle cx="0" cy="110" r="46" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <path d="M 0 92 L 0 110 L 14 118" fill="none" stroke="#0B1217" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B1217">Time &amp; materials</text>
  </g>

  <text x="600" y="600" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#0B1217" opacity="0.55">CONTRACT RISK ALLOCATION</text>
</svg>
