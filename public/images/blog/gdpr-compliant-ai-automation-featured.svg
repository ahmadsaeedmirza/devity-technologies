    <path d="M -22 -10 L -22 -34 C -22 -56, 22 -56, 22 -34 L 22 -10" fill="none" stroke="#2DD4BF" stroke-width="4"/>
    <circle cx="0" cy="16" r="7" fill="#2DD4BF"/>
    <line x1="0" y1="20" x2="0" y2="34" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Data flow tags -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B1217">
    <rect x="80" y="220" width="180" height="54" rx="27" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="170" y="253" text-anchor="middle">Lawful basis</text>

    <rect x="940" y="220" width="180" height="54" rx="27" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
