    <rect x="920" y="360" width="200" height="54" rx="27" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="1020" y="393" text-anchor="middle">Vendor due diligence</text>
  </g>

  <text x="600" y="590" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#0B1217" opacity="0.55">GDPR COMPLIANT AI AUTOMATION</text>
