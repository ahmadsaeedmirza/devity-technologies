    <circle cx="90" cy="530" r="3"/><circle cx="140" cy="530" r="3"/><circle cx="190" cy="530" r="3"/>
    <circle cx="90" cy="570" r="3"/><circle cx="140" cy="570" r="3"/><circle cx="190" cy="570" r="3"/>
    <circle cx="1010" cy="70" r="3"/><circle cx="1060" cy="70" r="3"/><circle cx="1110" cy="70" r="3"/>
    <circle cx="1010" cy="110" r="3"/><circle cx="1060" cy="110" r="3"/><circle cx="1110" cy="110" r="3"/>
  </g>

  <!-- soft background -->
  <circle cx="600" cy="310" r="230" fill="#2DD4BF" opacity="0.07"/>

  <!-- Shield, dark hero -->
