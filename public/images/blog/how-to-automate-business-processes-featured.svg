<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F7F4EC"/>

  <!-- Decorative dots -->
  <g fill="#0B1217" opacity="0.06">
    <circle cx="90" cy="520" r="3"/><circle cx="140" cy="520" r="3"/><circle cx="190" cy="520" r="3"/>
    <circle cx="90" cy="560" r="3"/><circle cx="140" cy="560" r="3"/><circle cx="190" cy="560" r="3"/>
  </g>

  <!-- soft background -->
  <circle cx="600" cy="300" r="250" fill="#2DD4BF" opacity="0.06"/>

  <!-- Path curve connecting 7 nodes -->
  <path d="M 130 380 Q 250 200, 380 280 T 620 220 T 860 300 T 1080 240" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-dasharray="1 8" stroke-linecap="round"/>

  <!-- Node positions -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700">
    <circle cx="130" cy="380" r="26" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <text x="130" y="386" text-anchor="middle" fill="#0B1217">1</text>

    <circle cx="300" cy="240" r="26" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <text x="300" y="246" text-anchor="middle" fill="#0B1217">2</text>

    <circle cx="470" cy="330" r="26" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <text x="470" y="336" text-anchor="middle" fill="#0B1217">3</text>

    <!-- Pilot, dark hero, larger -->
    <circle cx="620" cy="200" r="42" fill="#0B1217"/>
    <text x="620" y="208" text-anchor="middle" fill="#F7F4EC" font-size="18">4</text>

    <circle cx="770" cy="330" r="26" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <text x="770" y="336" text-anchor="middle" fill="#0B1217">5</text>

    <circle cx="940" cy="260" r="26" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <text x="940" y="266" text-anchor="middle" fill="#0B1217">6</text>

    <circle cx="1080" cy="240" r="26" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <text x="1080" y="246" text-anchor="middle" fill="#0B1217">7</text>
  </g>

  <text x="600" y="480" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#0B1217">Map. Pilot. Measure. Scale.</text>
  <text x="600" y="600" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#0B1217" opacity="0.55">THE AUTOMATION PLAYBOOK</text>
</svg>
