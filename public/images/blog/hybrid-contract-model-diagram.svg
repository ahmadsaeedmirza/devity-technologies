<svg width="1200" height="450" viewBox="0 0 1200 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="450" fill="#F7F4EC"/>

  <!-- connecting arrow -->
  <path d="M 470 225 L 610 225" stroke="#2DD4BF" stroke-width="3" fill="none" marker-end="url(#a8)"/>
  <defs>
    <marker id="a8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2DD4BF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Fixed discovery phase, dark hero -->
  <g transform="translate(270,225)">
    <rect x="-200" y="-140" width="400" height="280" rx="20" fill="#0B1217"/>
    <circle cx="0" cy="-60" r="34" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <path d="M -14 -60 L -4 -48 L 16 -74" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="10" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#F7F4EC">Discovery</text>
    <text x="0" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2DD4BF" font-weight="600">FIXED PRICE</text>
    <text x="0" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#F7F4EC" opacity="0.6">1-2 weeks, written brief</text>
    <text x="0" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#F7F4EC" opacity="0.6">and real pricing range</text>
  </g>

  <!-- Flexible build phase -->
  <g transform="translate(870,225)">
    <rect x="-200" y="-140" width="400" height="280" rx="20" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <circle cx="0" cy="-60" r="34" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <path d="M -16 -70 L 0 -50 L 16 -70" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" y1="-50" x2="0" y2="-46" stroke="#2DD4BF" stroke-width="3"/>
    <text x="0" y="10" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#0B1217">Build</text>
    <text x="0" y="36" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#0B6E56" font-weight="600">TIME &amp; MATERIALS</text>
    <text x="0" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0B1217" opacity="0.6">Shaped by what's</text>
    <text x="0" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0B1217" opacity="0.6">learned along the way</text>
  </g>
</svg>
