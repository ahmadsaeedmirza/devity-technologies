<svg width="1100" height="450" viewBox="0 0 1100 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="450" fill="#F7F4EC"/>

  <circle cx="550" cy="240" r="240" fill="#2DD4BF" opacity="0.04"/>

  <!-- paper, faded -->
  <g transform="translate(280,240)" opacity="0.5">
    <rect x="-90" y="-120" width="180" height="240" rx="8" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5" stroke-dasharray="5 5"/>
    <line x1="-55" y1="-70" x2="55" y2="-70" stroke="#0B1217" stroke-width="2"/>
    <line x1="-55" y1="-40" x2="30" y2="-40" stroke="#0B1217" stroke-width="2"/>
    <line x1="-55" y1="-10" x2="55" y2="-10" stroke="#0B1217" stroke-width="2"/>
    <text x="0" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B1217">Delayed</text>
  </g>

  <line x1="400" y1="240" x2="480" y2="240" stroke="#2DD4BF" stroke-width="3"/>
  <path d="M 465 228 L 480 240 L 465 252" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- real time, dark hero -->
  <g transform="translate(800,240)">
    <rect x="-150" y="-140" width="300" height="280" rx="20" fill="#0B1217"/>
    <circle cx="0" cy="-45" r="30" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <path d="M 0 -60 L 0 -45 L 12 -35" stroke="#2DD4BF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F7F4EC">Real-time</text>
    <text x="0" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2DD4BF">Floor visibility</text>
  </g>
</svg>
