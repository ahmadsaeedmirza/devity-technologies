<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F7F4EC"/>

  <!-- Decorative dots -->
  <g fill="#0B1217" opacity="0.06">
    <circle cx="90" cy="90" r="3"/><circle cx="140" cy="90" r="3"/><circle cx="190" cy="90" r="3"/>
    <circle cx="90" cy="130" r="3"/><circle cx="140" cy="130" r="3"/><circle cx="190" cy="130" r="3"/>
    <circle cx="1010" cy="510" r="3"/><circle cx="1060" cy="510" r="3"/><circle cx="1110" cy="510" r="3"/>
    <circle cx="1010" cy="550" r="3"/><circle cx="1060" cy="550" r="3"/><circle cx="1110" cy="550" r="3"/>
  </g>

  <!-- soft background -->
  <circle cx="600" cy="310" r="240" fill="#2DD4BF" opacity="0.06"/>

  <!-- Phone, dark hero -->
  <g transform="translate(500,310)">
    <rect x="-95" y="-190" width="190" height="380" rx="30" fill="#0B1217"/>
    <rect x="-75" y="-160" width="150" height="300" rx="6" fill="#F7F4EC"/>
    <circle cx="0" cy="163" r="10" fill="none" stroke="#0B1217" stroke-width="2.5"/>

    <!-- graph inside screen showing growth -->
    <path d="M -55 40 L -20 -10 L 15 20 L 55 -60" fill="none" stroke="#2DD4BF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="55" cy="-60" r="6" fill="#2DD4BF"/>
    <line x1="-55" y1="80" x2="55" y2="80" stroke="#0B1217" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Upward trend arrow accent -->
  <g transform="translate(830,260)">
    <circle cx="0" cy="0" r="90" fill="#2DD4BF" opacity="0.15"/>
    <path d="M -35 30 L 0 -10 L 35 20 L 60 -35" stroke="#0B1217" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 40 -35 L 60 -35 L 60 -15" stroke="#0B1217" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="600" y="590" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#0B1217" opacity="0.55">MOBILE APP MVP FOR INVESTORS</text>
</svg>
