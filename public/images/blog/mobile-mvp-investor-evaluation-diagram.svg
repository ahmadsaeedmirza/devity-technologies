<svg width="1100" height="450" viewBox="0 0 1100 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="450" fill="#F7F4EC"/>

  <!-- Left: Polish only -->
  <g transform="translate(300,225)">
    <rect x="-190" y="-120" width="380" height="240" rx="20" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5" stroke-dasharray="6 6"/>
    <circle cx="0" cy="-45" r="30" fill="none" stroke="#0B1217" stroke-width="2.5" opacity="0.5"/>
    <path d="M -12 -45 L 12 -45" stroke="#0B1217" stroke-width="2.5" opacity="0.5"/>
    <text x="0" y="20" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#0B1217" opacity="0.6">Polished demo</text>
    <text x="0" y="45" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0B1217" opacity="0.5">no usage data</text>
    <text x="0" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0B1217" opacity="0.5">Weaker story</text>
  </g>

  <!-- Right: Evidence, dark hero -->
  <g transform="translate(800,225)">
    <rect x="-200" y="-140" width="400" height="280" rx="20" fill="#0B1217"/>
    <circle cx="0" cy="-50" r="34" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <path d="M -12 -50 L -3 -40 L 16 -62" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="25" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#F7F4EC">Real evidence</text>
    <text x="0" y="52" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#F7F4EC" opacity="0.65">retention, activation,</text>
    <text x="0" y="72" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#F7F4EC" opacity="0.65">specific numbers</text>
    <text x="0" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2DD4BF">Stronger story</text>
  </g>
</svg>
