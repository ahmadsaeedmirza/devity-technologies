<svg width="1100" height="500" viewBox="0 0 1100 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="500" fill="#F7F4EC"/>

  <!-- background band -->
  <rect x="0" y="90" width="1100" height="320" fill="#2DD4BF" opacity="0.05"/>

  <!-- Core loop, dark hero, central -->
  <g transform="translate(550,250)">
    <circle cx="0" cy="0" r="120" fill="#0B1217"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <path d="M -40 -20 A 45 45 0 1 1 -40 20" fill="none" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round"/>
    <path d="M -50 -20 L -40 -20 L -40 -32" fill="none" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="65" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#F7F4EC">Core loop</text>
  </g>

  <!-- Surrounding nice-to-have bubbles, faded -->
  <g fill="#F7F4EC" stroke="#0B1217" stroke-width="2" opacity="0.55">
    <circle cx="230" cy="140" r="55"/>
    <circle cx="900" cy="150" r="45"/>
    <circle cx="200" cy="360" r="48"/>
    <circle cx="890" cy="370" r="52"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0B1217" opacity="0.6">
    <text x="230" y="145" text-anchor="middle">Leaderboard</text>
    <text x="900" y="155" text-anchor="middle">Badges</text>
    <text x="200" y="365" text-anchor="middle">Sharing</text>
    <text x="890" y="375" text-anchor="middle">Themes</text>
  </g>
</svg>
