<svg width="1100" height="480" viewBox="0 0 1100 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="480" fill="#F7F4EC"/>

  <circle cx="550" cy="260" r="250" fill="#2DD4BF" opacity="0.04"/>

  <text x="550" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1217">Launch is the start, not the finish</text>

  <g transform="translate(220,280)">
    <rect x="-160" y="-140" width="320" height="280" rx="20" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <circle cx="0" cy="-65" r="30" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <line x1="-15" y1="-70" x2="8" y2="-70" stroke="#2DD4BF" stroke-width="2.5"/>
    <text x="0" y="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B1217">ASO</text>
    <text x="0" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0B1217" opacity="0.55">Keywords, listing, reviews</text>
  </g>

  <g transform="translate(550,280)">
    <rect x="-170" y="-150" width="340" height="300" rx="22" fill="#0B1217"/>
    <path d="M 0 -85 L 30 -25 L -30 -25 Z" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linejoin="round"/>
    <line x1="0" y1="-70" x2="0" y2="-45" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F7F4EC">Crash monitoring</text>
    <text x="0" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2DD4BF">caught before reviews turn negative</text>
  </g>

  <g transform="translate(880,280)">
    <rect x="-160" y="-140" width="320" height="280" rx="20" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <path d="M -30 -50 A 30 30 0 1 1 -30 -30" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M -40 -55 L -30 -50 L -25 -60" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B1217">Updates</text>
    <text x="0" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0B1217" opacity="0.55">Ongoing, not one-time</text>
