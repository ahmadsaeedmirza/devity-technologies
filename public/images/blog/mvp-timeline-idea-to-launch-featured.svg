<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F7F4EC"/>

  <circle cx="600" cy="315" r="270" fill="#2DD4BF" opacity="0.05"/>

  <g fill="#0B1217" opacity="0.07">
    <circle cx="70" cy="70" r="3"/><circle cx="110" cy="70" r="3"/><circle cx="150" cy="70" r="3"/>
    <circle cx="70" cy="110" r="3"/><circle cx="110" cy="110" r="3"/><circle cx="150" cy="110" r="3"/>
    <circle cx="1050" cy="560" r="3"/><circle cx="1090" cy="560" r="3"/><circle cx="1130" cy="560" r="3"/>
    <circle cx="1050" cy="600" r="3"/><circle cx="1090" cy="600" r="3"/><circle cx="1130" cy="600" r="3"/>
  </g>

  <!-- path curve -->
  <path d="M 150 400 Q 350 280, 550 340 T 950 280" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-dasharray="1 9" stroke-linecap="round"/>

  <!-- Idea, start -->
  <g transform="translate(150,400)">
    <circle cx="0" cy="0" r="30" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <circle cx="0" cy="-6" r="10" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <line x1="0" y1="4" x2="0" y2="12" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B1217">Idea</text>
  </g>

  <!-- intermediate markers -->
  <circle cx="380" cy="300" r="16" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
  <circle cx="600" cy="345" r="16" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
  <circle cx="800" cy="300" r="16" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>

  <!-- Launch, dark hero, end -->
  <g transform="translate(970,275)">
    <circle cx="0" cy="0" r="46" fill="#0B1217"/>
    <path d="M 0 -22 L 10 4 L 0 -4 L -10 4 Z" fill="#2DD4BF"/>
    <text x="0" y="65" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B1217">Launch</text>
  </g>

  <text x="600" y="590" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#0B1217" opacity="0.55">A REALISTIC PRODUCT TIMELINE</text>
</svg>
