<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="420" fill="#F7F4EC"/>

  <line x1="100" y1="220" x2="1100" y2="220" stroke="#0B1217" stroke-width="2" opacity="0.2"/>

  <!-- Discovery -->
  <g transform="translate(180,220)">
    <circle cx="0" cy="0" r="14" fill="#0B1217"/>
    <rect x="-90" y="-130" width="180" height="90" rx="12" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="0" y="-95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B1217">Discovery</text>
    <text x="0" y="-72" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0B1217" opacity="0.55">1-2 weeks</text>
    <line x1="0" y1="-30" x2="0" y2="-14" stroke="#0B1217" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Design -->
  <g transform="translate(410,220)">
    <circle cx="0" cy="0" r="14" fill="#0B1217"/>
    <rect x="-85" y="30" width="170" height="90" rx="12" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="0" y="65" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B1217">Design</text>
    <text x="0" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0B1217" opacity="0.55">1-2 weeks</text>
    <line x1="0" y1="14" x2="0" y2="30" stroke="#0B1217" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Build, dark hero -->
  <g transform="translate(660,220)">
    <circle cx="0" cy="0" r="18" fill="#2DD4BF"/>
    <rect x="-100" y="-160" width="200" height="120" rx="14" fill="#0B1217"/>
    <text x="0" y="-110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F7F4EC">Build</text>
    <text x="0" y="-85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2DD4BF">2-4 weeks</text>
    <line x1="0" y1="-40" x2="0" y2="-18" stroke="#0B1217" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Test -->
  <g transform="translate(900,220)">
    <circle cx="0" cy="0" r="14" fill="#0B1217"/>
    <rect x="-95" y="30" width="190" height="90" rx="12" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="0" y="65" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B1217">Test</text>
    <text x="0" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0B1217" opacity="0.55">Ongoing + final pass</text>
    <line x1="0" y1="14" x2="0" y2="30" stroke="#0B1217" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Launch -->
  <g transform="translate(1050,220)">
    <circle cx="0" cy="0" r="14" fill="#0B1217"/>
    <rect x="-85" y="-130" width="170" height="90" rx="12" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="0" y="-95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B1217">Launch</text>
    <text x="0" y="-72" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0B1217" opacity="0.55">From week one</text>
    <line x1="0" y1="-30" x2="0" y2="-14" stroke="#0B1217" stroke-width="1.5" opacity="0.3"/>
  </g>
</svg>
