<svg width="1100" height="450" viewBox="0 0 1100 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="450" fill="#F7F4EC"/>
  <text x="550" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1217">Small patches, compounding fragility</text>
  <g transform="translate(0,380)">
    <rect x="150" y="-50" width="90" height="50" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="195" y="-65" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0B1217" opacity="0.6">Original</text>
    <rect x="280" y="-90" width="90" height="90" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="325" y="-105" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0B1217" opacity="0.6">+1 patch</text>
    <rect x="410" y="-140" width="90" height="140" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="455" y="-155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0B1217" opacity="0.6">+1 more</text>
    <rect x="540" y="-220" width="120" height="220" fill="#0B1217"/>
    <text x="600" y="-235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2DD4BF">Nobody fully understands it</text>
    <line x1="130" y1="0" x2="900" y2="0" stroke="#0B1217" stroke-width="2" opacity="0.2"/>
  </g>
</svg>
