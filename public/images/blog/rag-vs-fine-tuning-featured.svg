<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F7F4EC"/>

  <!-- Layered background circles for depth -->
  <circle cx="300" cy="200" r="180" fill="#2DD4BF" opacity="0.05"/>
  <circle cx="900" cy="420" r="200" fill="#2DD4BF" opacity="0.05"/>
  <circle cx="600" cy="315" r="280" fill="#2DD4BF" opacity="0.04"/>

  <!-- Decorative dot grids, four corners -->
  <g fill="#0B1217" opacity="0.07">
    <circle cx="70" cy="70" r="3"/><circle cx="110" cy="70" r="3"/><circle cx="150" cy="70" r="3"/>
    <circle cx="70" cy="110" r="3"/><circle cx="110" cy="110" r="3"/><circle cx="150" cy="110" r="3"/>
    <circle cx="70" cy="150" r="3"/><circle cx="110" cy="150" r="3"/><circle cx="150" cy="150" r="3"/>
    <circle cx="1050" cy="70" r="3"/><circle cx="1090" cy="70" r="3"/><circle cx="1130" cy="70" r="3"/>
    <circle cx="1050" cy="110" r="3"/><circle cx="1090" cy="110" r="3"/><circle cx="1130" cy="110" r="3"/>
    <circle cx="1050" cy="560" r="3"/><circle cx="1090" cy="560" r="3"/><circle cx="1130" cy="560" r="3"/>
    <circle cx="1050" cy="600" r="3"/><circle cx="1090" cy="600" r="3"/><circle cx="1130" cy="600" r="3"/>
  </g>

  <!-- thin connecting orbit rings -->
  <circle cx="600" cy="315" r="230" fill="none" stroke="#0B1217" stroke-width="1" opacity="0.08" stroke-dasharray="2 8"/>
  <circle cx="600" cy="315" r="180" fill="none" stroke="#0B1217" stroke-width="1" opacity="0.06" stroke-dasharray="2 8"/>

  <!-- Central model core -->
  <g transform="translate(600,315)">
    <circle cx="0" cy="0" r="72" fill="#0B1217"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <circle cx="-16" cy="-8" r="13" fill="none" stroke="#F7F4EC" stroke-width="2.5"/>
    <circle cx="16" cy="-8" r="13" fill="none" stroke="#F7F4EC" stroke-width="2.5"/>
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#2DD4BF" stroke-width="2"/>
    <text x="0" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F7F4EC">MODEL</text>
  </g>

  <!-- RAG path, left, database with retrieval arrow -->
  <g transform="translate(280,300)">
    <line x1="180" y1="15" x2="90" y2="15" stroke="#2DD4BF" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round"/>
    <path d="M 100 15 L 90 8 L 90 22 Z" fill="#2DD4BF"/>

    <rect x="-90" y="-90" width="180" height="180" rx="20" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <ellipse cx="0" cy="-35" rx="42" ry="15" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <path d="M -42 -35 L -42 30 A 42 15 0 0 0 42 30 L 42 -35" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="42" ry="15" fill="none" stroke="#2DD4BF" stroke-width="1.5" opacity="0.5"/>
    <text x="0" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#0B1217">RAG</text>
  </g>

  <!-- Fine-tune path, right, adapter/dial icon -->
  <g transform="translate(920,330)">
    <line x1="-180" y1="-15" x2="-90" y2="-15" stroke="#2DD4BF" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round"/>
    <path d="M -100 -15 L -90 -22 L -90 -8 Z" fill="#2DD4BF"/>

    <rect x="-90" y="-90" width="180" height="180" rx="20" fill="#0B1217"/>
    <line x1="-38" y1="-25" x2="38" y2="-25" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-14" cy="-25" r="9" fill="#F7F4EC"/>
    <line x1="-38" y1="10" x2="38" y2="10" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="18" cy="10" r="9" fill="#F7F4EC"/>
    <text x="0" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F7F4EC">FINE-TUNE</text>
  </g>

  <text x="600" y="590" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#0B1217" opacity="0.55">TWO WAYS TO SPECIALISE A MODEL</text>
</svg>
