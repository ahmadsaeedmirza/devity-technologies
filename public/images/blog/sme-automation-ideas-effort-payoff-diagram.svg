<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="600" fill="#F7F4EC"/>

  <text x="600" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B1217">Effort versus payoff</text>

  <!-- axes -->
  <line x1="150" y1="500" x2="1050" y2="500" stroke="#0B1217" stroke-width="2" opacity="0.3"/>
  <line x1="150" y1="500" x2="150" y2="100" stroke="#0B1217" stroke-width="2" opacity="0.3"/>
  <text x="600" y="545" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0B1217" opacity="0.6">Effort to implement</text>
  <text x="90" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0B1217" opacity="0.6" transform="rotate(-90 90 300)">Payoff</text>

  <!-- quadrant highlight, top-left = quick wins -->
  <rect x="150" y="100" width="450" height="200" fill="#2DD4BF" opacity="0.08"/>
  <text x="375" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B6E56">QUICK WINS</text>

  <!-- data points -->
  <g>
    <circle cx="230" cy="160" r="10" fill="#0B1217"/>
    <text x="230" y="145" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B1217">1</text>

    <circle cx="270" cy="180" r="10" fill="#0B1217"/>
    <text x="270" y="165" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B1217">2</text>

    <circle cx="210" cy="140" r="12" fill="#0B1217"/>
    <text x="210" y="123" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B1217">3</text>

    <circle cx="420" cy="170" r="10" fill="#0B1217"/>
    <text x="420" y="155" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B1217">4</text>

    <!-- item 5, dark hero, larger, higher effort but strong payoff -->
    <circle cx="750" cy="150" r="20" fill="#0B1217" stroke="#2DD4BF" stroke-width="3"/>
    <text x="750" y="156" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2DD4BF">5</text>

    <circle cx="300" cy="220" r="10" fill="#0B1217"/>
    <text x="300" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B1217">6</text>

    <circle cx="480" cy="260" r="10" fill="#0B1217"/>
    <text x="480" y="245" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B1217">7</text>

    <circle cx="560" cy="200" r="10" fill="#0B1217"/>
    <text x="560" y="185" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B1217">8</text>

    <circle cx="250" cy="190" r="10" fill="#0B1217"/>
    <text x="250" y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B1217">9</text>

    <circle cx="700" cy="270" r="10" fill="#0B1217"/>
    <text x="700" y="255" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B1217">10</text>
  </g>
</svg>
