<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F7F4EC"/>

  <!-- Decorative dots -->
  <g fill="#0B1217" opacity="0.06">
    <circle cx="90" cy="90" r="3"/><circle cx="140" cy="90" r="3"/><circle cx="190" cy="90" r="3"/>
    <circle cx="90" cy="130" r="3"/><circle cx="140" cy="130" r="3"/><circle cx="190" cy="130" r="3"/>
    <circle cx="1010" cy="510" r="3"/><circle cx="1060" cy="510" r="3"/><circle cx="1110" cy="510" r="3"/>
    <circle cx="1010" cy="550" r="3"/><circle cx="1060" cy="550" r="3"/><circle cx="1110" cy="550" r="3"/>
  </g>

  <!-- soft background -->
  <circle cx="600" cy="300" r="230" fill="#2DD4BF" opacity="0.07"/>

  <!-- Warning triangle, dark hero -->
  <g transform="translate(600,290)">
    <path d="M 0 -190 L 175 130 L -175 130 Z" fill="#0B1217"/>
    <path d="M 0 -190 L 175 130 L -175 130 Z" fill="none" stroke="#2DD4BF" stroke-width="4" stroke-linejoin="round"/>
    <line x1="0" y1="-90" x2="0" y2="30" stroke="#2DD4BF" stroke-width="10" stroke-linecap="round"/>
    <circle cx="0" cy="70" r="8" fill="#2DD4BF"/>
  </g>

  <!-- Four labeled tags around the triangle -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B1217">
    <rect x="60" y="130" width="180" height="54" rx="27" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="150" y="163" text-anchor="middle">Vague scope</text>

    <rect x="960" y="130" width="180" height="54" rx="27" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="1050" y="163" text-anchor="middle">No real proof</text>

    <rect x="60" y="450" width="220" height="54" rx="27" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="170" y="483" text-anchor="middle">Poor communication</text>

    <rect x="920" y="450" width="220" height="54" rx="27" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="1030" y="483" text-anchor="middle">Lock-in tactics</text>
  </g>

  <text x="600" y="600" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#0B1217" opacity="0.55">AGENCY RED FLAGS</text>
</svg>
