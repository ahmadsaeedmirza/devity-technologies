<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F7F4EC"/>

  <!-- Decorative dots -->
  <g fill="#0B1217" opacity="0.06">
    <circle cx="90" cy="90" r="3"/><circle cx="140" cy="90" r="3"/><circle cx="190" cy="90" r="3"/>
    <circle cx="90" cy="130" r="3"/><circle cx="140" cy="130" r="3"/><circle cx="190" cy="130" r="3"/>
    <circle cx="1010" cy="510" r="3"/><circle cx="1060" cy="510" r="3"/><circle cx="1110" cy="510" r="3"/>
    <circle cx="1010" cy="550" r="3"/><circle cx="1060" cy="550" r="3"/><circle cx="1110" cy="550" r="3"/>
  </g>

  <!-- soft background -->
  <circle cx="600" cy="310" r="230" fill="#2DD4BF" opacity="0.06"/>

  <!-- Blueprint/document behind the lens -->
  <g transform="translate(600,300)">
    <rect x="-140" y="-160" width="280" height="320" rx="10" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <line x1="-100" y1="-110" x2="100" y2="-110" stroke="#0B1217" stroke-width="2" opacity="0.3"/>
    <line x1="-100" y1="-75" x2="100" y2="-75" stroke="#0B1217" stroke-width="2" opacity="0.3"/>
    <line x1="-100" y1="-40" x2="60" y2="-40" stroke="#0B1217" stroke-width="2" opacity="0.3"/>
    <line x1="-100" y1="10" x2="100" y2="10" stroke="#0B1217" stroke-width="2" opacity="0.3"/>
    <line x1="-100" y1="45" x2="100" y2="45" stroke="#0B1217" stroke-width="2" opacity="0.3"/>
    <line x1="-100" y1="80" x2="40" y2="80" stroke="#0B1217" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Magnifying glass, dark hero -->
  <g transform="translate(660,270)">
    <circle cx="0" cy="0" r="95" fill="#0B1217" opacity="0.95"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#2DD4BF" stroke-width="5"/>
    <line x1="68" y1="68" x2="140" y2="140" stroke="#0B1217" stroke-width="22" stroke-linecap="round"/>
    <line x1="68" y1="68" x2="140" y2="140" stroke="#2DD4BF" stroke-width="8" stroke-linecap="round"/>
    <text x="0" y="10" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F7F4EC">£</text>
  </g>

  <text x="600" y="600" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#0B1217" opacity="0.55">THE DISCOVERY PHASE</text>
</svg>
