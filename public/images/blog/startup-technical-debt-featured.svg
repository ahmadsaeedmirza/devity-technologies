<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F7F4EC"/>

  <circle cx="600" cy="315" r="270" fill="#2DD4BF" opacity="0.05"/>

  <g fill="#0B1217" opacity="0.07">
    <circle cx="70" cy="70" r="3"/><circle cx="110" cy="70" r="3"/><circle cx="150" cy="70" r="3"/>
    <circle cx="70" cy="110" r="3"/><circle cx="110" cy="110" r="3"/><circle cx="150" cy="110" r="3"/>
    <circle cx="1050" cy="560" r="3"/><circle cx="1090" cy="560" r="3"/><circle cx="1130" cy="560" r="3"/>
    <circle cx="1050" cy="600" r="3"/><circle cx="1090" cy="600" r="3"/><circle cx="1130" cy="600" r="3"/>
  </g>

  <!-- Stacked blocks, dark hero, representing layered decisions -->
  <g transform="translate(600,340)">
    <rect x="-160" y="-40" width="320" height="70" rx="10" fill="#0B1217"/>
    <rect x="-130" y="-100" width="260" height="60" rx="10" fill="#0B1217"/>
    <rect x="-100" y="-155" width="200" height="55" rx="10" fill="#0B1217"/>

    <!-- deliberate marker joints, visible and intentional -->
    <line x1="-160" y1="30" x2="160" y2="30" stroke="#2DD4BF" stroke-width="3"/>
    <circle cx="-100" cy="30" r="5" fill="#2DD4BF"/>
    <circle cx="0" cy="30" r="5" fill="#2DD4BF"/>
    <circle cx="100" cy="30" r="5" fill="#2DD4BF"/>

    <line x1="-130" y1="-40" x2="130" y2="-40" stroke="#2DD4BF" stroke-width="3"/>
    <circle cx="-70" cy="-40" r="5" fill="#2DD4BF"/>
    <circle cx="70" cy="-40" r="5" fill="#2DD4BF"/>
  </g>

  <text x="600" y="590" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#0B1217" opacity="0.55">STARTUP TECHNICAL DEBT</text>
</svg>
