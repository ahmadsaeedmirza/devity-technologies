<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="420" fill="#F7F4EC"/>

  <line x1="100" y1="220" x2="1100" y2="220" stroke="#0B1217" stroke-width="2" opacity="0.2"/>

  <g transform="translate(180,220)">
    <circle cx="0" cy="0" r="14" fill="#0B1217"/>
    <rect x="-100" y="-130" width="200" height="90" rx="12" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="0" y="-90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B1217">Conversations</text>
    <text x="0" y="-68" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0B1217" opacity="0.55">lowest cost</text>
    <line x1="0" y1="-30" x2="0" y2="-14" stroke="#0B1217" stroke-width="1.5" opacity="0.3"/>
  </g>

  <g transform="translate(460,220)">
    <circle cx="0" cy="0" r="14" fill="#0B1217"/>
    <rect x="-100" y="30" width="200" height="90" rx="12" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="0" y="65" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B1217">Landing page</text>
    <text x="0" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0B1217" opacity="0.55">real action tested</text>
    <line x1="0" y1="14" x2="0" y2="30" stroke="#0B1217" stroke-width="1.5" opacity="0.3"/>
  </g>

  <g transform="translate(740,220)">
    <circle cx="0" cy="0" r="16" fill="#0B1217"/>
    <rect x="-105" y="-135" width="210" height="95" rx="12" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="0" y="-95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B1217">Prototype</text>
    <text x="0" y="-73" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0B1217" opacity="0.55">flow tested</text>
    <line x1="0" y1="-30" x2="0" y2="-16" stroke="#0B1217" stroke-width="1.5" opacity="0.3"/>
  </g>

  <!-- Pre-sale, dark hero, final -->
  <g transform="translate(1020,220)">
    <circle cx="0" cy="0" r="20" fill="#2DD4BF"/>
    <rect x="-115" y="30" width="230" height="110" rx="16" fill="#0B1217"/>
    <text x="0" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F7F4EC">Pre-sale</text>
    <text x="0" y="95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2DD4BF">real willingness to pay</text>
    <line x1="0" y1="16" x2="0" y2="30" stroke="#0B1217" stroke-width="1.5" opacity="0.3"/>
  </g>
</svg>
