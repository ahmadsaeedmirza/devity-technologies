<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F7F4EC"/>

  <!-- layered depth -->
  <circle cx="600" cy="315" r="280" fill="#2DD4BF" opacity="0.05"/>

  <!-- decorative dots -->
  <g fill="#0B1217" opacity="0.07">
    <circle cx="70" cy="70" r="3"/><circle cx="110" cy="70" r="3"/><circle cx="150" cy="70" r="3"/>
    <circle cx="70" cy="110" r="3"/><circle cx="110" cy="110" r="3"/><circle cx="150" cy="110" r="3"/>
    <circle cx="1050" cy="560" r="3"/><circle cx="1090" cy="560" r="3"/><circle cx="1130" cy="560" r="3"/>
    <circle cx="1050" cy="600" r="3"/><circle cx="1090" cy="600" r="3"/><circle cx="1130" cy="600" r="3"/>
  </g>

  <!-- Founder figure -->
  <g transform="translate(600,220)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#0B1217" stroke-width="3.5"/>
    <path d="M -65 150 C -65 65, 65 65, 65 150 L 65 185 L -65 185 Z" fill="none" stroke="#0B1217" stroke-width="3.5" stroke-linejoin="round"/>
  </g>

  <!-- diverging paths -->
  <path d="M 600 400 L 300 480" stroke="#2DD4BF" stroke-width="2.5" stroke-dasharray="1 8" stroke-linecap="round"/>
  <path d="M 600 400 L 450 500" stroke="#2DD4BF" stroke-width="2.5" stroke-dasharray="1 8" stroke-linecap="round"/>
  <path d="M 600 400 L 600 510" stroke="#2DD4BF" stroke-width="2.5" stroke-dasharray="1 8" stroke-linecap="round"/>
  <path d="M 600 400 L 750 500" stroke="#2DD4BF" stroke-width="2.5" stroke-dasharray="1 8" stroke-linecap="round"/>
  <path d="M 600 400 L 900 480" stroke="#2DD4BF" stroke-width="2.5" stroke-dasharray="1 8" stroke-linecap="round"/>

  <!-- five small endpoint markers, one dark hero -->
  <circle cx="300" cy="480" r="20" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
  <circle cx="450" cy="500" r="20" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
  <circle cx="600" cy="520" r="28" fill="#0B1217"/>
  <circle cx="750" cy="500" r="20" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
  <circle cx="900" cy="480" r="20" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>

  <text x="600" y="590" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#0B1217" opacity="0.55">BUILDING WITHOUT A TECHNICAL CO-FOUNDER</text>
</svg>
