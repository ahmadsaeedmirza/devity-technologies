<svg width="1100" height="480" viewBox="0 0 1100 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="480" fill="#F7F4EC"/>

  <circle cx="550" cy="260" r="250" fill="#2DD4BF" opacity="0.04"/>

  <!-- Central ownership badge, dark hero -->
  <g transform="translate(550,260)">
    <circle cx="0" cy="0" r="130" fill="#0B1217"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <rect x="-40" y="-15" width="80" height="60" rx="8" fill="none" stroke="#2DD4BF" stroke-width="3.5"/>
    <path d="M -25 -15 L -25 -38 C -25 -60, 25 -60, 25 -38 L 25 -15" fill="none" stroke="#2DD4BF" stroke-width="3.5"/>
    <text x="0" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F7F4EC">You own it,</text>
    <text x="0" y="102" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F7F4EC">entirely</text>
  </g>

  <!-- three surrounding labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0B1217">
    <rect x="60" y="90" width="190" height="56" rx="28" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="155" y="124" text-anchor="middle">Code</text>

    <rect x="850" y="90" width="190" height="56" rx="28" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="945" y="124" text-anchor="middle">Documentation</text>

    <rect x="440" y="400" width="220" height="56" rx="28" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="550" y="434" text-anchor="middle">Design &amp; data</text>
  </g>

  <line x1="250" y1="118" x2="440" y2="220" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="1 8"/>
  <line x1="850" y1="118" x2="660" y2="220" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="1 8"/>
  <line x1="550" y1="400" x2="550" y2="390" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="1 8"/>
</svg>
