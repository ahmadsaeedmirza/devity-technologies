<svg width="1200" height="500" viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="500" fill="#F7F4EC"/>

  <circle cx="600" cy="270" r="260" fill="#2DD4BF" opacity="0.04"/>

  <text x="600" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1217">Five ways to move forward without one</text>

  <!-- four smaller + one dark hero, in a row -->
  <g transform="translate(140,290)">
    <rect x="-100" y="-110" width="200" height="220" rx="16" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <circle cx="0" cy="-50" r="24" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <text x="0" y="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B1217">Freelancer</text>
  </g>

  <g transform="translate(400,270)">
    <rect x="-115" y="-130" width="230" height="260" rx="18" fill="#0B1217"/>
    <circle cx="-15" cy="-60" r="14" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <circle cx="15" cy="-40" r="14" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <text x="0" y="20" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F7F4EC">Agency</text>
  </g>

  <g transform="translate(660,290)">
    <rect x="-100" y="-110" width="200" height="220" rx="16" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <circle cx="0" cy="-50" r="24" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <path d="M -8 -50 L -8 -62 M -8 -40 L -8 -38" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0B1217">Tech advisor</text>
  </g>

  <g transform="translate(900,290)">
    <rect x="-100" y="-110" width="200" height="220" rx="16" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <rect x="-24" y="-64" width="48" height="30" rx="4" fill="none" stroke="#2DD4BF" stroke-width="2.5"/>
    <text x="0" y="15" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0B1217">No-code</text>
  </g>

  <g transform="translate(1090,290)">
    <rect x="-70" y="-90" width="140" height="180" rx="14" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5" stroke-dasharray="5 5"/>
    <text x="0" y="0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0B1217" opacity="0.6">Co-founder</text>
    <text x="0" y="16" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0B1217" opacity="0.6">later</text>
  </g>
</svg>
