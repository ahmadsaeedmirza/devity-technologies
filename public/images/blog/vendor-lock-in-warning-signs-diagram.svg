<svg width="1000" height="700" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="700" fill="#F7F4EC"/>

  <!-- Decorative dots -->
  <g fill="#0B1217" opacity="0.06">
    <circle cx="880" cy="80" r="3"/><circle cx="920" cy="80" r="3"/>
    <circle cx="880" cy="115" r="3"/><circle cx="920" cy="115" r="3"/>
  </g>

  <!-- soft background -->
  <circle cx="500" cy="330" r="220" fill="#2DD4BF" opacity="0.06"/>

  <!-- Padlock, dark hero, central -->
  <g transform="translate(500,330)">
    <rect x="-70" y="-20" width="140" height="120" rx="14" fill="#0B1217"/>
    <path d="M -42 -20 L -42 -70 C -42 -112, 42 -112, 42 -70 L 42 -20" fill="none" stroke="#0B1217" stroke-width="18"/>
    <path d="M -42 -20 L -42 -70 C -42 -112, 42 -112, 42 -70 L 42 -20" fill="none" stroke="#2DD4BF" stroke-width="8"/>
    <circle cx="0" cy="32" r="14" fill="none" stroke="#2DD4BF" stroke-width="6"/>
    <line x1="0" y1="46" x2="0" y2="68" stroke="#2DD4BF" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Four surrounding warning tags -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B1217">
    <rect x="80" y="80" width="220" height="70" rx="14" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="190" y="110" text-anchor="middle">Proprietary</text>
    <text x="190" y="132" text-anchor="middle">platforms</text>

    <rect x="700" y="80" width="220" height="70" rx="14" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="810" y="110" text-anchor="middle">Unclear IP</text>
    <text x="810" y="132" text-anchor="middle">ownership</text>

    <rect x="80" y="550" width="220" height="70" rx="14" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="190" y="580" text-anchor="middle">Thin</text>
    <text x="190" y="602" text-anchor="middle">documentation</text>

    <rect x="700" y="550" width="220" height="70" rx="14" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="810" y="580" text-anchor="middle">Punitive exit</text>
    <text x="810" y="602" text-anchor="middle">terms</text>
  </g>

  <!-- connecting lines -->
  <g stroke="#2DD4BF" stroke-width="2" stroke-dasharray="3 6" opacity="0.6">
    <line x1="300" y1="115" x2="440" y2="260"/>
    <line x1="700" y1="115" x2="560" y2="260"/>
    <line x1="300" y1="585" x2="440" y2="400"/>
    <line x1="700" y1="585" x2="560" y2="400"/>
  </g>
</svg>
