<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F7F4EC"/>

  <!-- layered depth -->
  <circle cx="600" cy="315" r="270" fill="#2DD4BF" opacity="0.05"/>

  <!-- decorative dots -->
  <g fill="#0B1217" opacity="0.07">
    <circle cx="70" cy="70" r="3"/><circle cx="110" cy="70" r="3"/><circle cx="150" cy="70" r="3"/>
    <circle cx="70" cy="110" r="3"/><circle cx="110" cy="110" r="3"/><circle cx="150" cy="110" r="3"/>
    <circle cx="1050" cy="560" r="3"/><circle cx="1090" cy="560" r="3"/><circle cx="1130" cy="560" r="3"/>
    <circle cx="1050" cy="600" r="3"/><circle cx="1090" cy="600" r="3"/><circle cx="1130" cy="600" r="3"/>
  </g>

  <!-- Globe, dark hero -->
  <g transform="translate(560,310)">
    <circle cx="0" cy="0" r="150" fill="#0B1217"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#2DD4BF" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="60" ry="150" fill="none" stroke="#2DD4BF" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="110" ry="150" fill="none" stroke="#2DD4BF" stroke-width="1.5" opacity="0.35"/>
    <line x1="-150" y1="-75" x2="150" y2="-75" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#2DD4BF" stroke-width="1.5" opacity="0.5"/>
    <line x1="-150" y1="75" x2="150" y2="75" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>

    <!-- location pins -->
    <circle cx="-60" cy="-40" r="8" fill="#2DD4BF"/>
    <circle cx="70" cy="20" r="8" fill="#2DD4BF"/>
    <path d="M -60 -40 Q 20 -110, 70 20" stroke="#2DD4BF" stroke-width="2" fill="none" stroke-dasharray="1 6" opacity="0.7"/>
  </g>

  <!-- Magnifying glass overlay -->
  <g transform="translate(700,380)">
    <circle cx="0" cy="0" r="90" fill="#F7F4EC" opacity="0.15" stroke="#2DD4BF" stroke-width="5"/>
    <line x1="63" y1="63" x2="130" y2="130" stroke="#0B1217" stroke-width="20" stroke-linecap="round"/>
    <line x1="63" y1="63" x2="130" y2="130" stroke="#2DD4BF" stroke-width="7" stroke-linecap="round"/>
  </g>

  <text x="600" y="600" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#0B1217" opacity="0.55">VETTING A REMOTE TEAM</text>
</svg>
