<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F7F4EC"/>

  <!-- Decorative dots -->
  <g fill="#0B1217" opacity="0.06">
    <circle cx="90" cy="530" r="3"/><circle cx="140" cy="530" r="3"/><circle cx="190" cy="530" r="3"/>
    <circle cx="90" cy="570" r="3"/><circle cx="140" cy="570" r="3"/><circle cx="190" cy="570" r="3"/>
    <circle cx="1010" cy="70" r="3"/><circle cx="1060" cy="70" r="3"/><circle cx="1110" cy="70" r="3"/>
    <circle cx="1010" cy="110" r="3"/><circle cx="1060" cy="110" r="3"/><circle cx="1110" cy="110" r="3"/>
  </g>

  <!-- soft background -->
  <circle cx="600" cy="300" r="230" fill="#2DD4BF" opacity="0.07"/>

  <!-- Circular reasoning loop path -->
  <circle cx="600" cy="300" r="190" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-dasharray="1 10" stroke-linecap="round"/>

  <!-- arrows around the loop -->
  <path d="M 790 300 A 190 190 0 0 1 600 490" fill="none" stroke="#2DD4BF" stroke-width="3" marker-end="url(#a3)"/>
  <path d="M 600 490 A 190 190 0 0 1 410 300" fill="none" stroke="#2DD4BF" stroke-width="3" marker-end="url(#a3)"/>
  <path d="M 410 300 A 190 190 0 0 1 600 110" fill="none" stroke="#2DD4BF" stroke-width="3" marker-end="url(#a3)"/>
  <path d="M 600 110 A 190 190 0 0 1 790 300" fill="none" stroke="#2DD4BF" stroke-width="3" marker-end="url(#a3)"/>
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2DD4BF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Observe node -->
  <g transform="translate(600,110)">
    <circle cx="0" cy="0" r="72" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <circle cx="0" cy="-6" r="20" fill="none" stroke="#0B1217" stroke-width="2.5"/>
    <circle cx="0" cy="-6" r="7" fill="#0B1217"/>
    <text x="0" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B1217">Observe</text>
  </g>

  <!-- Plan node -->
  <g transform="translate(790,300)">
    <circle cx="0" cy="0" r="72" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <path d="M -18 10 L -6 -14 L 6 4 L 18 -18" fill="none" stroke="#0B1217" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18" cy="-18" r="4" fill="#0B1217"/>
    <text x="0" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B1217">Plan</text>
  </g>

  <!-- Act node, dark hero -->
  <g transform="translate(600,490)">
    <circle cx="0" cy="0" r="82" fill="#0B1217"/>
    <path d="M -14 -20 L 14 -20 L 4 0 L 20 0 L -10 30 L -2 6 L -20 6 Z" fill="#2DD4BF"/>
    <text x="0" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#F7F4EC">Act</text>
  </g>

  <!-- Evaluate node -->
  <g transform="translate(410,300)">
    <circle cx="0" cy="0" r="72" fill="#F7F4EC" stroke="#0B1217" stroke-width="3"/>
    <path d="M -18 -2 L -6 12 L 18 -16" fill="none" stroke="#0B1217" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="-2" r="26" fill="none" stroke="#0B1217" stroke-width="2"/>
    <text x="0" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0B1217">Evaluate</text>
  </g>

  <text x="600" y="595" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#0B1217" opacity="0.55">AI AGENT REASONING LOOP</text>
</svg>
