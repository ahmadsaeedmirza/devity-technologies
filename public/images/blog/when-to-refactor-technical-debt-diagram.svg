<svg width="1100" height="480" viewBox="0 0 1100 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="1100" height="480" fill="#F7F4EC"/>

  <circle cx="550" cy="260" r="250" fill="#2DD4BF" opacity="0.04"/>

  <text x="550" y="55" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0B1217">Watch velocity, not appearance</text>

  <!-- axes -->
  <line x1="150" y1="400" x2="950" y2="400" stroke="#0B1217" stroke-width="2" opacity="0.25"/>
  <line x1="150" y1="400" x2="150" y2="120" stroke="#0B1217" stroke-width="2" opacity="0.25"/>
  <text x="550" y="440" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0B1217" opacity="0.55">Time</text>
  <text x="90" y="260" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0B1217" opacity="0.55" transform="rotate(-90 90 260)">Feature velocity</text>

  <!-- declining velocity line -->
  <path d="M 180 180 C 350 200, 500 260, 650 330 C 750 370, 850 385, 920 390" fill="none" stroke="#0B1217" stroke-width="3"/>

  <!-- refactor trigger point, dark hero -->
  <circle cx="700" cy="345" r="14" fill="#2DD4BF"/>
  <rect x="620" y="270" width="220" height="55" rx="12" fill="#0B1217"/>
  <text x="730" y="303" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2DD4BF">Refactor here</text>
</svg>
