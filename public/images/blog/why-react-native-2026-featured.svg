<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#F7F4EC"/>

  <!-- Decorative dots -->
  <g fill="#0B1217" opacity="0.06">
    <circle cx="90" cy="90" r="3"/><circle cx="140" cy="90" r="3"/><circle cx="190" cy="90" r="3"/>
    <circle cx="90" cy="130" r="3"/><circle cx="140" cy="130" r="3"/><circle cx="190" cy="130" r="3"/>
    <circle cx="1010" cy="510" r="3"/><circle cx="1060" cy="510" r="3"/><circle cx="1110" cy="510" r="3"/>
    <circle cx="1010" cy="550" r="3"/><circle cx="1060" cy="550" r="3"/><circle cx="1110" cy="550" r="3"/>
  </g>

  <!-- soft background -->
  <circle cx="600" cy="315" r="240" fill="#2DD4BF" opacity="0.07"/>

  <!-- Phone outline, central -->
  <g transform="translate(600,320)">
    <rect x="-95" y="-190" width="190" height="380" rx="30" fill="#0B1217"/>
    <rect x="-75" y="-160" width="150" height="300" rx="6" fill="#F7F4EC"/>
    <circle cx="0" cy="163" r="10" fill="none" stroke="#0B1217" stroke-width="2.5"/>

    <!-- stacked layers inside screen -->
    <rect x="-60" y="-135" width="120" height="50" rx="8" fill="#2DD4BF" opacity="0.25"/>
    <text x="0" y="-104" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B1217">JavaScript</text>

    <path d="M -30 -75 L 0 -55 L 30 -75" stroke="#2DD4BF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="-60" y="-45" width="120" height="50" rx="8" fill="#0B1217"/>
    <text x="0" y="-14" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F7F4EC">JSI (direct)</text>

    <path d="M -30 15 L 0 35 L 30 15" stroke="#2DD4BF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="-60" y="45" width="120" height="50" rx="8" fill="#2DD4BF" opacity="0.25"/>
    <text x="0" y="76" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0B1217">Native UI</text>
  </g>

  <!-- Label tags either side -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0B1217">
    <rect x="80" y="150" width="150" height="56" rx="28" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="155" y="185" text-anchor="middle">Bridgeless</text>

    <rect x="80" y="440" width="150" height="56" rx="28" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="155" y="475" text-anchor="middle">Hermes</text>

    <rect x="970" y="150" width="150" height="56" rx="28" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="1045" y="185" text-anchor="middle">Expo</text>

    <rect x="960" y="440" width="170" height="56" rx="28" fill="#F7F4EC" stroke="#0B1217" stroke-width="2.5"/>
    <text x="1045" y="475" text-anchor="middle">EAS</text>
  </g>

  <text x="600" y="600" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4" fill="#0B1217" opacity="0.55">REACT NATIVE 2026</text>
</svg>
